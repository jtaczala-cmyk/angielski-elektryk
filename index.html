<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2340" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07111c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Rozmowa po brytyjsku dla elektryka. Słówka z budowy i powtórki.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Elektryk EN">
  <meta name="format-detection" content="telephone=no">
  <title>Angielski elektryk</title>
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <path fill="#f6e3c4" d="M18 2 8 18h7l-2 12 12-18h-8l1-10z"/>
          </svg>
        </span>
        <div>
          <p class="eyebrow">Brytyjski angielski</p>
          <h1 id="title">Rozmowa</h1>
        </div>
      </div>
      <label class="level">
        <span>Poziom</span>
        <select id="level" aria-label="Poziom angielskiego">
          <option value="A2">A2</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
          <option value="C1">C1</option>
        </select>
      </label>
    </header>
    <main id="main"></main>
    <nav class="nav" aria-label="Główne">
      <button type="button" data-route="talk" id="nav-talk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v9H8l-3 3V6z"/></svg>
        Rozmowa
      </button>
      <button type="button" data-route="cards" id="nav-cards">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14l-7-3-7 3V5a2 2 0 0 1 2-2z"/></svg>
        Słówka
        <span id="due-badge" class="badge" hidden>0</span>
      </button>
      <button type="button" data-route="settings" id="nav-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.2 4.8-.9.5a7.2 7.2 0 0 1 0 1.4l.9.5-1.2 2.1-1-.3a7.4 7.4 0 0 1-1.2.7l-.2 1h-2.4l-.2-1a7.4 7.4 0 0 1-1.2-.7l-1 .3-1.2-2.1.9-.5a7.2 7.2 0 0 1 0-1.4l-.9-.5 1.2-2.1 1 .3a7.4 7.4 0 0 1 1.2-.7l.2-1h2.4l.2 1c.4.2.8.4 1.2.7l1-.3 1.2 2.1z"/></svg>
        Ustawienia
      </button>
    </nav>
  </div>
  <audio id="voice" playsinline preload="none"></audio>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>
    <p class="noscript">Ta aplikacja potrzebuje JavaScript. Włącz go w Safari i odśwież stronę.</p>
  </noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
